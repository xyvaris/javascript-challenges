<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payroll Risk Report — Web Version</title>
</head>
<body>
  <header>
    <h1>Payroll Risk Report</h1>
    <button id="showAll">Show All</button>
    <button id="showInactive">Show Inactive</button>
    <button id="showActive">Show Active</button>
    <section>
      <ul id="showEmployees"></ul>
    </section>
  </header>
  <main>
    <table style="border-collapse: collapse;">
      <thead>
        <tr>
          <th>Department</th>
          <th>Employees</th>
          <th>Total Salary</th>
          <th>Avg Salary</th>
          <th>Risk</th>
        </tr>
      </thead>
      <tbody id="dataTable">

      </tbody>
    </table>
  </main>

  <script src="payroll_risk_report.js"></script>
</body>
</html>
